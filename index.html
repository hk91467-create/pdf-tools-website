<!DOCTYPE html>
<html>
<head>
    <title>My PDF Tools</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        h1 { font-size: 3em; margin-bottom: 20px; }
        p { font-size: 1.2em; opacity: 0.9; }
        .tools {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 50px auto;
        }
        .tool-card {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>
    <h1>📄 PDF Tools</h1>
    <p>Free Online PDF Tools - Coming Soon!</p>
    <div class="tools">
        <div class="tool-card">
            <h2>🔗 Merge PDF</h2>
            <p>Combine multiple PDFs</p>
        </div>
        <div class="tool-card">
            <h2>✂️ Split PDF</h2>
            <p>Extract pages</p>
        </div>
        <div class="tool-card">
            <h2>📦 Compress</h2>
            <p>Reduce file size</p>
        </div>
    </div>
</body>
</html>
